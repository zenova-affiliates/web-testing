<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scroll-driven Frame Animation</title>
  <style>
    :root {
      --animation-height: 400vh;
      --background: #0b0d12;
      --foreground: #f5f7fb;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: system-ui, sans-serif;
    }

    .intro,
    .outro {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 3rem;
      text-align: center;
    }

    .scroll-animation {
      position: relative;
      height: var(--animation-height);
    }

    .animation-stage {
      position: sticky;
      top: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--background);
    }

    #animation-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--background);
      z-index: 2;
      transition: opacity 300ms ease;
    }

    .loading.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .progress {
      width: min(320px, 70vw);
      height: 4px;
      margin-top: 1rem;
      border-radius: 99px;
      background: #2b3040;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #fff;
      transition: width 100ms linear;
    }
  </style>
</head>
<body>
  <section class="intro">
    <div>
      <h1>Scroll to play</h1>
      <p>The animation begins below.</p>
    </div>
  </section>

  <section class="scroll-animation" id="scroll-animation">
    <div class="animation-stage">
      <canvas id="animation-canvas" aria-label="Scroll-controlled animation"></canvas>
      <div class="loading" id="loading" aria-live="polite">
        <div>
          <div>Loading animation… <span id="loading-text">0%</span></div>
          <div class="progress" aria-hidden="true">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="outro">
    <p>End of animation</p>
  </section>

  <script>
    const FRAME_COUNT = 240;
    // Upload the extracted WebP files to this folder on your website.
    const FRAME_PATH = "/assets/animation_frames/frame_";

    const canvas = document.getElementById("animation-canvas");
    const context = canvas.getContext("2d");
    const animationSection = document.getElementById("scroll-animation");
    const loading = document.getElementById("loading");
    const loadingText = document.getElementById("loading-text");
    const progressBar = document.getElementById("progress-bar");

    const frames = [];
    let currentFrame = 0;
    let animationRequest = null;

    function frameUrl(index) {
      // The exported files are frame_0001.webp through frame_0240.webp.
      return `${FRAME_PATH}${String(index + 1).padStart(4, "0")}.webp`;
    }

    function loadFrame(index) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.decoding = "async";
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error(`Could not load ${frameUrl(index)}`));
        image.src = frameUrl(index);
      });
    }

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = window.innerWidth;
      const height = window.innerHeight;

      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;

      // Draw using CSS-pixel coordinates while retaining sharpness on HiDPI screens.
      context.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawFrame(currentFrame);
    }

    function drawFrame(index) {
      const image = frames[index];
      if (!image) return;

      currentFrame = index;
      const width = window.innerWidth;
      const height = window.innerHeight;
      const imageRatio = image.naturalWidth / image.naturalHeight;
      const viewportRatio = width / height;

      // "contain": shows the entire 16:9 source without cropping.
      let drawWidth = width;
      let drawHeight = width / imageRatio;
      if (viewportRatio < imageRatio) {
        drawHeight = height;
        drawWidth = height * imageRatio;
      }

      const x = (width - drawWidth) / 2;
      const y = (height - drawHeight) / 2;

      context.clearRect(0, 0, width, height);
      context.drawImage(image, x, y, drawWidth, drawHeight);
    }

    function updateFromScroll() {
      const bounds = animationSection.getBoundingClientRect();
      const scrollableDistance = animationSection.offsetHeight - window.innerHeight;
      const progress = Math.max(0, Math.min(1, -bounds.top / scrollableDistance));
      const nextFrame = Math.round(progress * (FRAME_COUNT - 1));

      if (nextFrame !== currentFrame && !animationRequest) {
        animationRequest = requestAnimationFrame(() => {
          drawFrame(nextFrame);
          animationRequest = null;
        });
      }
    }

    async function initialize() {
      try {
        // Loading in batches avoids creating 240 simultaneous network requests.
        const batchSize = 12;
        for (let start = 0; start < FRAME_COUNT; start += batchSize) {
          const end = Math.min(start + batchSize, FRAME_COUNT);
          const batch = await Promise.all(
            Array.from({ length: end - start }, (_, offset) => loadFrame(start + offset))
          );
          frames.push(...batch);

          const percent = Math.round((frames.length / FRAME_COUNT) * 100);
          loadingText.textContent = `${percent}%`;
          progressBar.style.width = `${percent}%`;
        }

        resizeCanvas();
        drawFrame(0);
        loading.classList.add("is-hidden");
        updateFromScroll();
      } catch (error) {
        loadingText.textContent = "Unable to load frames";
        console.error(error);
      }
    }

    window.addEventListener("scroll", updateFromScroll, { passive: true });
    window.addEventListener("resize", resizeCanvas);
    initialize();
  </script>
</body>
</html>
